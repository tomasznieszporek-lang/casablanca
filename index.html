<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casablanca – WZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
header{background:#1f2937;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}
.wrap{max-width:1200px;margin:auto;padding:16px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0001}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
input,button{font:inherit}
input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}
.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{min-height:105px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 8px #0001;cursor:pointer;padding:14px;text-align:center;font-weight:bold;transition:.12s}
.tile:active{transform:scale(.97)}
.tile small{display:block;margin-top:8px;font-weight:normal;opacity:.7}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#374151;color:#fff}
.btn.primary{background:#166534} .btn.danger{background:#b91c1c} .btn.light{background:#e5e7eb;color:#111827}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 5px;border-bottom:1px solid #e5e7eb;text-align:left}
th:last-child,td:last-child{text-align:right}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:bold;margin-top:14px}
.manage{margin-top:16px}
.manage-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.muted{color:#6b7280;font-size:13px}
.empty{color:#6b7280;padding:25px 0;text-align:center}
.wz-logo{margin-bottom:10px;text-align:center;display:flex;justify-content:center;align-items:center}
.wz-logo img{max-width:240px;max-height:90px;display:block;object-fit:contain;margin:0 auto}
/* ===== Dostosowanie do telefonu i tabletu ===== */
@media (max-width: 900px) {
  body { font-size: 16px; }
  header { padding: 12px 14px; position: sticky; top: 0; z-index: 20; }
  header h1 { font-size: 18px; }
  .wrap { padding: 10px; }
  .layout, .top { grid-template-columns: 1fr; gap: 10px; }
  .card { border-radius: 12px; padding: 12px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { min-height: 105px; padding: 12px 8px; font-size: 17px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .btn { min-height: 46px; padding: 10px 13px; }
  input { min-height: 46px; font-size: 16px; }
  .actions { gap: 8px; }
  .actions .btn { flex: 1 1 auto; }
  .wz-logo img { max-width: 210px; max-height: 80px; }
}

@media (max-width: 600px) {
  header { position: sticky; top: 0; }
  header h1 { font-size: 16px; }
  .wrap { padding: 8px; }
  .top { margin-bottom: 8px; }
  .card { padding: 10px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .tile { min-height: 100px; font-size: 16px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .products-card .actions { margin-top: 16px; }
  .tile small { font-size: 12px; }
  table { font-size: 13px; }
  th, td { padding: 8px 4px; }
  .sum { font-size: 19px; }
  .manage-row { grid-template-columns: 1fr; gap: 6px; }
  .manage-row .btn { width: 100%; }
  .wz-logo img { max-width: 190px; max-height: 72px; }
}

@media (max-width: 380px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile { min-height: 78px; font-size: 14px; }
  header .btn { padding: 8px 10px; min-height: 42px; }
}

/* Na urządzeniach dotykowych nie zaznaczamy tekstu podczas szybkiego klikania kafelków. */
@media (pointer: coarse) {
  .tile, .btn { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
}

@media print{
 body{background:#fff}
 header,.no-print,.products-card,.manage{display:none!important}
 .wrap{max-width:none;padding:0}
 .layout{display:block}
 .card{box-shadow:none;padding:0}
 #wzCard{display:block!important}
 .wz-logo img{max-width:260px;max-height:100px}
}
</style>
</head>

<header>
<h1>Casablanca – Sprzedaż mobilna</h1>

<div class="actions">
<button class="btn primary" onclick="showAddProduct()">+ Dodaj towar</button>
<button class="btn light" onclick="showManage()">Zarządzaj towarami</button>
</div>
</div>

<div class="sum"><span>Razem</span><span id="total">0,00 zł</span></div>
<div class="actions no-print">
<button class="btn primary" onclick="printWZ()">Drukuj / zapisz PDF</button>
<button class="btn danger" onclick="clearWZ()">Wyczyść WZ</button>
</div>
</div>
</div>

<div class="card manage no-print" id="manage" style="display:none">
<h2>Zarządzanie towarami</h2>
<div id="productList"></div>
<div class="actions"><button class="btn light" onclick="hideManage()">Zamknij</button></div>
</div>
</div>

<script>
const KEY_PRODUCTS='wz_products_v3', KEY_COUNTER='wz_counter_v3';
const DEFAULT_PRODUCTS=[{"id": 1, "name": "Róża", "category": "Kwiaty"}, {"id": 2, "name": "Chryzantema", "category": "Kwiaty"}, {"id": 3, "name": "Eustoma", "category": "Kwiaty"}, {"id": 4, "name": "Gipsówka", "category": "Kwiaty"}, {"id": 5, "name": "Goździk", "category": "Kwiaty"}, {"id": 6, "name": "Hortensja", "category": "Kwiaty"}, {"id": 7, "name": "Santini", "category": "Kwiaty"}, {"id": 8, "name": "Zieleń dekoracyjna", "category": "Kwiaty"}, {"id": 9, "name": "Anturium", "category": "Kwiaty"}, {"id": 10, "name": "Słonecznik", "category": "Kwiaty"}, {"id": 11, "name": "Gerbera", "category": "Kwiaty"}, {"id": 12, "name": "Lilia", "category": "Kwiaty"}];
let products=JSON.parse(localStorage.getItem(KEY_PRODUCTS)||'null');
if(!Array.isArray(products) || products.length===0){
  products=DEFAULT_PRODUCTS.map(p=>({...p}));
  localStorage.setItem(KEY_PRODUCTS,JSON.stringify(products));
}
let items=[];

function saveProducts(){localStorage.setItem(KEY_PRODUCTS,JSON.stringify(products));}
function money(v){return Number(v||0).toFixed(2).replace('.',',')+' zł';}
function nextNumber(){let n=Number(localStorage.getItem(KEY_COUNTER)||0)+1;localStorage.setItem(KEY_COUNTER,String(n));return 'WZ/'+String(n).padStart(4,'0');}
function sortProducts(){products.sort((a,b)=>a.name.localeCompare(b.name,'pl',{sensitivity:'base'}));}
function init(){
 document.getElementById('wzNumber').value=nextNumber();
 document.getElementById('viewNumber').textContent=document.getElementById('wzNumber').value;
 document.getElementById('viewDate').textContent=new Date().toLocaleDateString('pl-PL');
 document.getElementById('wzNumber').addEventListener('input',refresh);
 document.getElementById('client').addEventListener('input',refresh);
 renderTiles();refresh();
}
function renderTiles(){
 sortProducts(); const el=document.getElementById('tiles');el.innerHTML='';
 products.forEach(p=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`${escapeHtml(p.name)}<small>Kliknij, aby dodać</small>`;b.onclick=()=>addProduct(p.id);el.appendChild(b);});
}
function addProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 let qty=prompt('Podaj ilość dla: '+p.name,'1');if(qty===null)return;
 qty=Number(String(qty).replace(',','.'));if(!qty||qty<0){alert('Podaj poprawną ilość.');return;}
 let price=prompt('Podaj cenę za sztukę dla: '+p.name,'');if(price===null)return;
 price=Number(String(price).replace(',','.'));if(isNaN(price)||price<0){alert('Podaj poprawną cenę.');return;}
 items.push({productId:id,qty,price});refresh();
}
function refresh(){
 document.getElementById('viewNumber').textContent=document.getElementById('wzNumber').value||'—';
 document.getElementById('viewClient').textContent=document.getElementById('client').value||'—';
 const el=document.getElementById('wzItems');
 if(!items.length)el.innerHTML='<div class="empty">Brak pozycji. Kliknij kafelek towaru.</div>';
 else{
  let h='<table><thead><tr><th>Towar</th><th>Ilość</th><th>Cena</th><th>Wartość</th><th></th></tr></thead><tbody>';
  items.forEach((it,i)=>{const p=products.find(x=>x.id===it.productId);h+=`<tr><td>${escapeHtml(p?p.name:'?')}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(it.qty*it.price)}</td><td><button class="btn danger" style="padding:5px 8px" onclick="removeItem(${i})">×</button></td></tr>`;});
  el.innerHTML=h+'</tbody></table>';
 }
 document.getElementById('total').textContent=money(items.reduce((s,x)=>s+x.qty*x.price,0));
}
function removeItem(i){items.splice(i,1);refresh();}
function clearWZ(){if(confirm('Wyczyścić bieżącą WZ?')){items=[];refresh();}}
function newWZ(){if(items.length&&!confirm('Rozpocząć nową WZ? Bieżące pozycje zostaną usunięte.'))return;items=[];document.getElementById('client').value='';document.getElementById('wzNumber').value=nextNumber();refresh();}
function printWZ(){if(!items.length){alert('WZ nie ma żadnych pozycji.');return;}window.print();}
function showAddProduct(){
 const name=prompt('Nazwa towaru:');if(!name)return;
 const category=prompt('Kategoria (opcjonalnie):','Kwiaty')||'';
 products.push({id:Date.now(),name,category});saveProducts();renderTiles();renderManage();
}
function showManage(){document.getElementById('manage').style.display='block';renderManage();document.getElementById('manage').scrollIntoView({behavior:'smooth'});}
function hideManage(){document.getElementById('manage').style.display='none';}
function renderManage(){
 sortProducts();const el=document.getElementById('productList');
 el.innerHTML=products.map((p,i)=>`<div class="manage-row"><input value="${escapeAttr(p.name)}" onchange="editProduct(${i},'name',this.value)"><input value="${escapeAttr(p.category||'')}" placeholder="Kategoria" onchange="editProduct(${i},'category',this.value)"><button class="btn danger" onclick="deleteProduct(${i})">Usuń</button></div>`).join('');
}
function editProduct(i,k,v){products[i][k]=v;saveProducts();renderTiles();renderManage();}
function deleteProduct(i){if(!confirm('Usunąć towar?'))return;products.splice(i,1);saveProducts();renderTiles();renderManage();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#096;');}
init();
</script>
</body>
</html>
